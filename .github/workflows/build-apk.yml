name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: bash ./tool/bootstrap_android.sh
      - run: flutter pub get
      - name: Clean Android build outputs
        run: flutter clean && flutter pub get
      - name: Validate FE question bank
        run: python3 tool/validate_fe_questions.py
      - name: Audit FE question-bank coverage and review gaps
        run: python3 tool/audit_fe_questions.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: level-me-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
