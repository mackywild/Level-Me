name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Generate Android project
        run: bash ./tool/bootstrap_android.sh
      - run: flutter pub get
      - name: Clean Android build outputs
        run: flutter clean && flutter pub get
      - name: Validate FE question bank
        run: python3 tool/validate_fe_questions.py
      - name: Audit FE question-bank coverage and review gaps
        run: python3 tool/audit_fe_questions.py --strict
      - name: Audit FE answer position balance
        run: python3 tool/rebalance_fe_answer_positions.py --check
      - name: Audit IPA syllabus classification coverage
        run: python3 tool/audit_fe_syllabus.py --strict
      - name: Test IPA syllabus coverage mapping
        run: python3 -m unittest discover -s tool -p "test_audit_fe_syllabus.py"
      - name: Test FE answer position balancing
        run: python3 -m unittest discover -s tool -p "test_rebalance_fe_answer_positions.py"
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Report APK signing certificate
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: level-me-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
